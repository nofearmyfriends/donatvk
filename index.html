<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="viewport-fit" content="cover">
  <title>Поддержка проекта</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="main-content">
      <h1 class="page-title">Поддержка проекта</h1>
      <p class="page-description">
        Ваша поддержка помогает создавать новые проекты и улучшать существующие ✨ Спасибо за ваш вклад! 🙏
      </p>
      
      <div class="goal-container">
        <div class="goal-info">
          <span class="goal-label">Цель:</span>
          <span class="goal-amount">5 000 ₽</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" style="width: 0%"></div>
        </div>
        <div class="progress-text">0 ₽ из 5 000 ₽</div>
      </div>
      
      <div class="donate-buttons">
        <button class="donate-button">99₽ - VK Donat</button>
      </div>

      <button class="feedback-button">Обратная связь</button>
    </div>
    
    <div class="donaters-wall">
      <h2 class="donaters-title">🏆 Стена донатеров</h2>
      <div id="donatersList" class="donaters-list"></div>
    </div>
  </div>
  
  <div id="feedback-modal" class="modal" style="display: none;">
    <div class="modal-content">
      <span class="close">&times;</span>
      <h2>Обратная связь</h2>
      <input type="text" id="feedback-name" placeholder="Ваше имя" required>
      <textarea id="feedback-question" placeholder="Ваш вопрос" required></textarea>
      <button id="submit-feedback">Отправить</button>
    </div>
  </div>
  
  <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
  <script src="index.js"></script>
</body>
</html>
