<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Поддержка проекта</title>
  <base href="https://nofearmyfriends.github.io/donatvk/">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="main-content">
      <h1 class="page-title">Поддержка проекта</h1>
      <p class="page-description">
        Ваша поддержка помогает создавать новые проекты и улучшать существующие ✨ Спасибо за ваш вклад! 🙏
      </p>
      
      <div class="goal-container">
        <div class="goal-info">
          <span class="goal-label">Цель:</span>
          <span class="goal-amount">5 000 ₽</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" style="width: 0%"></div>
        </div>
        <div class="progress-text">0 ₽ из 5 000 ₽</div>
      </div>
      
      <div class="donate-buttons">
        <button class="donate-button" data-amount="50">50 ₽</button>
        <button class="donate-button" data-amount="100">100 ₽</button>
        <button class="donate-button" data-amount="150">150 ₽</button>
        <button class="donate-button" data-amount="custom">Своя сумма</button>
      </div>
      
      <button class="support-button">Поддержать проект</button>
    </div>
    
    <div class="donors-wall">
      <h2 class="donors-title">🏆 Стена донатеров</h2>
      <div class="donors-list"></div>
    </div>
  </div>
  
  <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
  <script src="index.js"></script>
</body>
</html>
