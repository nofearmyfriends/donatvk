<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="viewport-fit" content="cover">
  <title>Поддержка проекта</title>
  <link rel="stylesheet" href="style.css">
  <!-- Добавляем библиотеку для QR-кодов -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
</head>
<body>
  <div class="container">
    <div class="main-content">
      <h1 class="page-title">Поддержка проекта</h1>
      <p class="page-description">
        Ваша поддержка помогает создавать новые проекты и улучшать существующие ✨ Спасибо за ваш вклад! 🙏
      </p>
      
      <div class="goal-container">
        <div class="goal-info">
          <span class="goal-label">Цель:</span>
          <span class="goal-amount">5 000 ₽</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" style="width: 0%"></div>
        </div>
        <div class="progress-text" id="currentAmount">0 ₽ из 5 000 ₽</div>
      </div>
      
      <div class="donate-buttons">
        <button class="donate-button">99₽ - VK Donat</button>
        <button class="donate-button" data-amount="150">150₽</button>
        <button class="donate-button" data-amount="200">200₽</button>
        <button class="donate-button" data-amount="custom">Своя сумма</button>
      </div>
    </div>
    
    <div class="donaters-wall">
      <h2 class="donaters-title">🏆 Стена донатеров</h2>
      <div id="donatersList" class="donaters-list"></div>
    </div>
  </div>
  
  <!-- Модальное окно -->
  <div id="modal" class="modal">
    <div class="modal-content">
      <span class="close" id="cancelButton">&times;</span>
      <h2>Подтверждение</h2>
      <input type="number" id="amount" placeholder="Введите сумму" min="1">
      <button id="sendButton">Отправить</button>
    </div>
  </div>

  <!-- Модальное окно успеха -->
  <div id="successModal" class="modal">
    <div class="modal-content">
      <span class="close" id="closeSuccessButton">&times;</span>
      <h2>Успех!</h2>
      <p>Ваш донат успешно отправлен. Спасибо за поддержку!</p>
    </div>
  </div>

  <!-- Модальное окно для СБП -->
  <div id="sbp-modal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <h2>Оплата через СБП</h2>
      <div class="sbp-container">
        <a href="#" id="sbp-link">
          <img src="images/sber_SBP.jpg" alt="СБП Сбербанк" class="sbp-logo">
        </a>
        <div id="sbol-pay-container"></div>
        <div class="payment-info">
          <p>Сумма: <span id="payment-amount">0</span>₽</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Модальное окно для ввода своей суммы -->
  <div id="custom-amount-modal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <h2>Введите сумму</h2>
      <input type="number" id="custom-amount" placeholder="Введите сумму" min="1">
      <button id="confirm-amount">Подтвердить</button>
    </div>
  </div>
  
  <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
  <script src="https://securecardpayment.ru/payment/modules/sbol-pay/sbol-pay.js"></script>
  <script>
    window.addEventListener('load', function() {
        if (!window.SbolPay) {
            console.error('SbolPay widget script failed to load');
        } else {
            console.log('SbolPay widget script loaded successfully');
        }
    });
  </script>
  <script src="js/sbp.js"></script>
  <script src="index.js"></script>
</body>
</html>
